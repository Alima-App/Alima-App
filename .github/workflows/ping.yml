name: Ping Supabase

on:
  schedule:
    - cron: '0 */6 * * *'  # setiap 6 jam
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "${{ https://ngrwayktygwewagodfmi.supabase.co }}/rest/v1/" \
            -H "apikey: ${{ sb_publishable_OlWly1qy3WUh2UEgEnKbCQ_DZPvWS7m }}" \
            -o /dev/null -w "Status: %{http_code}, Waktu: %{time_total}s\n"
