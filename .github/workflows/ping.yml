name: Ping Supabase

on:
  schedule:
    - cron: '0 */6 * * *'  # setiap 6 jam
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -s "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_KEY }}" \
            -o /dev/null -w "Status: %{http_code}, Waktu: %{time_total}s\n"
